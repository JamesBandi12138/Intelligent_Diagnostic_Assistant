name: intelligent-diagnostic-assistant

services:
  mysql:
    image: mysql:8.0
    container_name: ida_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: ida
    ports:
      - "3308:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql

  postgres:
    image: postgres:16-alpine
    container_name: ida_postgres
    environment:
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: ida_memory
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ida_redis
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis:/data

  minio:
    image: minio/minio:latest
    container_name: ida_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - ./data/minio:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ida_backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      MILVUS_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - mysql
      - postgres
      - redis
      - minio

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ida_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      - backend
